<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>VetSystem - Registrar</title>
    <!-- Importamos Bootstrap para que se vea bonito -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#"><i class="bi bi-heart-pulse"></i> VetSystem</a>
        <!-- Aquí mostramos el nombre del servidor (app-01 o app-02) -->
        <span class="navbar-text text-white">
            <i class="bi bi-server"></i> Nodo: <strong>{{ hostname }}</strong>
        </span>
    </div>
</nav>

<main class="container my-4">
    <!-- Lógica de Jinja2 para mostrar mensajes de éxito o error (los del flash en app.py) -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show shadow-sm">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <h2 class="mb-3"><i class="bi bi-clipboard-plus text-primary"></i> Registrar nuevo paciente</h2>
    
    <!-- FORMULARIO: Envía datos por POST a la ruta /registrar -->
    <form class="card p-4 shadow-sm border-0" method="POST" action="/registrar">
        <h5 class="text-primary border-bottom pb-2"><i class="bi bi-person"></i> Datos del dueño</h5>
        <div class="row g-3 mb-4 mt-1">
            <!-- El atributo 'name' es VITAL, porque con ese nombre lo lee app.py (request.form['owner_name']) -->
            <div class="col-md-6"><label class="form-label fw-semibold">Nombre *</label>
                <input type="text" class="form-control" name="owner_name" required></div>
            <div class="col-md-6"><label class="form-label fw-semibold">Teléfono</label>
                <input type="text" class="form-control" name="owner_phone"></div>
            <!-- ... el resto de inputs del dueño ... -->
        </div>

        <h5 class="text-primary border-bottom pb-2"><i class="bi bi-github"></i> Datos de la mascota</h5>
        <div class="row g-3 mb-4 mt-1">
            <div class="col-md-6"><label class="form-label fw-semibold">Nombre *</label>
                <input type="text" class="form-control" name="pet_name" required></div>
            <div class="col-md-6"><label class="form-label fw-semibold">Especie</label>
                <select class="form-select" name="pet_species">
                    <option>Perro</option><option>Gato</option><option>Ave</option><option>Otro</option>
                </select></div>
            <!-- ... el resto de inputs de la mascota ... -->
        </div>

        <h5 class="text-primary border-bottom pb-2"><i class="bi bi-clipboard-pulse"></i> Motivo de la consulta</h5>
        <div class="mb-3 mt-3"><label class="form-label fw-semibold">Motivo *</label>
            <textarea class="form-control" name="reason" rows="2" required></textarea></div>
        <div class="mb-3"><label class="form-label fw-semibold">Diagnóstico</label>
            <textarea class="form-control" name="diagnosis" rows="2"></textarea></div>

        <div class="d-flex gap-2 border-top pt-3">
            <!-- Botón de envío -->
            <button class="btn btn-primary px-4" type="submit"><i class="bi bi-save"></i> Guardar Paciente</button>
        </div>
    </form>
</main>
</body>
</html>
