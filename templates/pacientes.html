<!doctype html>
<html lang="es">
<!-- ... (mismo head y navbar) ... -->
<body class="bg-light">
<!-- ... (navbar) ... -->
<main class="container my-4">
    <h2 class="mb-4"><i class="bi bi-list-ul text-primary"></i> Lista de Pacientes</h2>
    
    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Mascota</th>
                        <th>Especie</th>
                        <th>Dueño</th>
                        <th>Teléfono</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- BUCLE DE JINJA2: Recorre la lista 'pacientes' enviada desde app.py -->
                    {% for pet, owner in pacientes %}
                    <tr>
                        <!-- pet.id, pet.name, etc., son los atributos de los modelos de Python -->
                        <td class="text-muted">#{{ pet.id }}</td>
                        <td><i class="bi bi-github text-primary"></i> <strong>{{ pet.name }}</strong></td>
                        <td>{{ pet.species }}</td>
                        <td>{{ owner.name }}</td>
                        <!-- El 'or' es una salvaguarda por si el teléfono viene vacío -->
                        <td>{{ owner.phone or 'N/A' }}</td>
                    </tr>
                    <!-- Si la lista está vacía, se ejecuta este bloque -->
                    {% else %}
                    <tr>
                        <td colspan="5" class="text-center text-muted py-4">No hay pacientes registrados aún.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
