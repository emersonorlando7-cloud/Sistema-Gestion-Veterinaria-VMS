<!doctype html>
<html lang="es">
<head>
    <!-- Configuración básica y carga de Bootstrap para el diseño -->
    <meta charset="utf-8">
    <title>Usuarios - VetSystem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<!-- Barra de navegación superior -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('inicio') }}"><i class="bi bi-heart-pulse"></i> VetSystem</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" href="{{ url_for('inicio') }}"><i class="bi bi-house"></i> Inicio</a>
            <a class="nav-link" href="{{ url_for('registrar_paciente') }}"><i class="bi bi-plus-circle"></i> Registrar</a>
            <a class="nav-link" href="{{ url_for('pacientes') }}"><i class="bi bi-list-ul"></i> Pacientes</a>
            <a class="nav-link active" href="{{ url_for('usuarios') }}"><i class="bi bi-people"></i> Usuarios</a>
        </div>
        <!-- Muestra el usuario actual y su rol, además del botón de salir -->
        <div class="d-flex align-items-center text-white">
            <span class="me-3"><i class="bi bi-person-circle"></i> {{ session.username }} ({{ session.role }})</span>
            <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right"></i> Salir</a>
        </div>
    </div>
</nav>

<main class="container my-4">
    <div class="row">
        <!-- Formulario de creación de usuario -->
        <div class="col-md-4">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-primary text-white">Crear Nuevo Usuario</div>
                <div class="card-body">
                    <form method="POST" action="/usuarios">
                        <div class="mb-2">
                            <label>Usuario</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="mb-2">
                            <label>Contraseña</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Rol</label>
                            <!-- AQUÍ ESTÁN LOS NUEVOS ROLES SOLICITADOS -->
                            <select name="role" class="form-select">
                                <option value="recepcionista">Recepcionista</option>
                                <option value="veterinario">Veterinario</option>
                                <option value="asistente">Asistente</option>
                                <option value="sistemas">Sistemas</option>
                                <option value="admin">Administrador</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Guardar Usuario</button>
                    </form>
                </div>
            </div>
        </div>
        
        <!-- Tabla que muestra los usuarios registrados -->
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-dark text-white">Usuarios Registrados</div>
                <div class="card-body p-0">
                    <table class="table table-hover mb-0">
                        <thead>
                            <tr><th>ID</th><th>Usuario</th><th>Rol</th></tr>
                        </thead>
                        <tbody>
                            <!-- Bucle Jinja2 para mostrar cada usuario -->
                            {% for u in usuarios %}
                            <tr>
                                <td>{{ u.id }}</td>
                                <td>{{ u.username }}</td>
                                <td><span class="badge bg-info text-dark">{{ u.role }}</span></td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
