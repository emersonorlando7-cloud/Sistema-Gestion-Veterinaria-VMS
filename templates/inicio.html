<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Inicio - VetSystem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('inicio') }}"><i class="bi bi-heart-pulse"></i> VetSystem</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link active" href="{{ url_for('inicio') }}"><i class="bi bi-house"></i> Inicio</a>
            <a class="nav-link" href="{{ url_for('registrar_paciente') }}"><i class="bi bi-plus-circle"></i> Registrar</a>
            <a class="nav-link" href="{{ url_for('pacientes') }}"><i class="bi bi-list-ul"></i> Pacientes</a>
            <a class="nav-link" href="{{ url_for('usuarios') }}"><i class="bi bi-people"></i> Usuarios</a>
        </div>
        <span class="navbar-text text-white"><i class="bi bi-server"></i> Nodo: <strong>{{ hostname }}</strong></span>
    </div>
</nav>

<main class="container my-4">
    <h2 class="mb-4"><i class="bi bi-speedometer2 text-primary"></i> Panel de Control</h2>
    <div class="row g-3 mb-4">
        <!-- Tarjeta Pacientes -->
        <div class="col-md-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <p class="text-muted mb-1 small text-uppercase fw-semibold">Total Pacientes</p>
                        <h3 class="mb-0 fw-bold">{{ total_pacientes }}</h3>
                    </div>
                    <div class="bg-primary bg-opacity-10 rounded-circle p-3">
                        <i class="bi bi-heart-pulse fs-4 text-primary"></i>
                    </div>
                </div>
            </div>
        </div>
        <!-- Tarjeta Dueños -->
        <div class="col-md-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <p class="text-muted mb-1 small text-uppercase fw-semibold">Total Dueños</p>
                        <h3 class="mb-0 fw-bold">{{ total_duenos }}</h3>
                    </div>
                    <div class="bg-success bg-opacity-10 rounded-circle p-3">
                        <i class="bi bi-people fs-4 text-success"></i>
                    </div>
                </div>
            </div>
        </div>
        <!-- Tarjeta Consultas (CORREGIDA) -->
        <div class="col-md-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body d-flex justify-content-between align-items-center">
                    <div>
                        <p class="text-muted mb-1 small text-uppercase fw-semibold">Consultas Totales</p>
                        <h3 class="mb-0 fw-bold">{{ total_consultas }}</h3>
                    </div>
                    <div class="bg-warning bg-opacity-10 rounded-circle p-3">
                        <i class="bi bi-calendar-check fs-4 text-warning"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
