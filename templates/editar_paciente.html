<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Editar Paciente - VetSystem</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('inicio') }}"><i class="bi bi-heart-pulse"></i> VetSystem</a>
        <div class="navbar-nav me-auto">
            <a class="nav-link" href="{{ url_for('inicio') }}"><i class="bi bi-house"></i> Inicio</a>
            <a class="nav-link" href="{{ url_for('registrar_paciente') }}"><i class="bi bi-plus-circle"></i> Registrar</a>
            <a class="nav-link active" href="{{ url_for('pacientes') }}"><i class="bi bi-list-ul"></i> Pacientes</a>
            <a class="nav-link" href="{{ url_for('usuarios') }}"><i class="bi bi-people"></i> Usuarios</a>
        </div>
        <div class="d-flex align-items-center text-white">
            <span class="me-3"><i class="bi bi-person-circle"></i> {{ session.username }} ({{ session.role }})</span>
            <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right"></i> Salir</a>
        </div>
    </div>
</nav>

<main class="container my-4">
    <h2 class="mb-3"><i class="bi bi-pencil-square text-warning"></i> Editar Paciente #{{ pet.id }}</h2>
    
    <form class="card p-4 shadow-sm border-0" method="POST">
        <h5 class="text-primary border-bottom pb-2"><i class="bi bi-person"></i> Datos del dueño</h5>
        <div class="row g-3 mb-4 mt-1">
            <div class="col-md-6"><label class="form-label">Nombre *</label>
                <input type="text" class="form-control" name="owner_name" value="{{ owner.name }}" required></div>
            <div class="col-md-6"><label class="form-label">Teléfono</label>
                <input type="text" class="form-control" name="owner_phone" value="{{ owner.phone or '' }}"></div>
            <div class="col-md-6"><label class="form-label">Email</label>
                <input type="email" class="form-control" name="owner_email" value="{{ owner.email or '' }}"></div>
            <div class="col-md-6"><label class="form-label">Dirección</label>
                <input type="text" class="form-control" name="owner_address" value="{{ owner.address or '' }}"></div>
        </div>

        <h5 class="text-primary border-bottom pb-2"><i class="bi bi-github"></i> Datos de la mascota</h5>
        <div class="row g-3 mb-4 mt-1">
            <div class="col-md-6"><label class="form-label">Nombre *</label>
                <input type="text" class="form-control" name="pet_name" value="{{ pet.name }}" required></div>
            <div class="col-md-6"><label class="form-label">Especie</label>
                <select class="form-select" name="pet_species">
                    <option value="Perro" {% if pet.species == 'Perro' %}selected{% endif %}>Perro</option>
                    <option value="Gato" {% if pet.species == 'Gato' %}selected{% endif %}>Gato</option>
                    <option value="Ave" {% if pet.species == 'Ave' %}selected{% endif %}>Ave</option>
                    <option value="Otro" {% if pet.species == 'Otro' %}selected{% endif %}>Otro</option>
                </select></div>
            <div class="col-md-4"><label class="form-label">Raza</label>
                <input type="text" class="form-control" name="pet_breed" value="{{ pet.breed or '' }}"></div>
            <div class="col-md-4"><label class="form-label">Edad</label>
                <input type="number" class="form-control" name="pet_age" value="{{ pet.age or '' }}"></div>
            <div class="col-md-4"><label class="form-label">Peso</label>
                <input type="number" step="0.01" class="form-control" name="pet_weight" value="{{ pet.weight or '' }}"></div>
        </div>

        <div class="d-flex gap-2 border-top pt-3">
            <button class="btn btn-warning px-4" type="submit"><i class="bi bi-save"></i> Actualizar Datos</button>
            <a href="{{ url_for('pacientes') }}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
